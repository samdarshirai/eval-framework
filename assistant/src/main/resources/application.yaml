# Packaged in assistant.jar. Start from the repo root: assistant.docs is relative to the working directory. Override any key with ./config/application.yaml or --key=value.
server:
  port: 8080
  address: 127.0.0.1   # loopback only: the stub holds an API key
spring:
  main:
    banner-mode: "off"
assistant:
  model: anthropic/claude-haiku-4.5   # a model id your provider accepts
  # baseUrl: https://llm-gateway.example.com/v1   # OpenAI-compatible API root; default OpenRouter. Untested with other endpoints (requests carry OpenRouter-only fields).
  topK: 3
  docs: docs
