# Packaged in assistant.jar. Start from the repo root: assistant.docs is relative to the working directory. Override any key with ./config/application.yaml or --key=value.
server:
  port: 8080
  address: 127.0.0.1   # loopback only: the stub holds an API key
spring:
  main:
    banner-mode: "off"
assistant:
  model: anthropic/claude-haiku-4.5
  topK: 3
  docs: docs
