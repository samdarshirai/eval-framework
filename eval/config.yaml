# Settings for the eval harness. This file holds the defaults.
#
# One-time override: pass --<key> <value> to the jar. The value beats this file for that run only.
#   java -jar eval.jar --passFloor 0.8 --baseline caseResults/baseline.json
#
# How overrides work:
#   - Every key in this file can be overridden. --config <file> is not a key: it picks this file.
#   - The value is read as YAML, so it has the same type as here: true, 0.8, a path, [a, b].
#   - A nested key uses dots: --calibration.trapPairs my-traps.yaml
#   - An unknown key is an error. If a key is repeated, the last value wins.
#   - --skip-calibration is a shorthand for --skipCalibration true.
#   - A relative path, from this file or from the command line, resolves against this file's directory.
#
endpoint: http://localhost:8080/answer
passFloor: 0.90
# Skip the judge trap pairs and the Groundedness sample that normally run first. Default: false.
# skipCalibration: false
# A previous report to compare with. A case that passed there and fails now fails the run, after one re-run.
# Not set: this is logged and the run goes ahead without a regression check.
# Set but no file at the path (or the file is unusable): an error, exit code 2.
# Pass --baseline "" to switch it off for one run.
# baseline: caseResults/baseline.json
# Judge model for Coverage and Groundedness (D15, D40). OpenRouter slug; stronger than assistant.model.
judgeModel: anthropic/claude-opus-4.8
# What the judge costs, USD per million tokens, so the report can estimate cost from measured tokens (D17).
# Prices of judgeModel on its OpenRouter route (D40: azure/global). Not set: tokens are reported, cost is not estimated.
judgePricing:
  inputPerMillion: 5.0
  outputPerMillion: 25.0
# Categories this app's cases may use. 'out-of-scope' is required: the exit rule (D13) keys on it.
categories: [single-source, multi-source, false-premise, out-of-scope, edge-case]
# Paths below (knowledgeBase.path, cases, outputDir, calibration.trapPairs) resolve against the directory of
# the config file when it is passed with `--config <file>`, and against the repo root (the working directory)
# for this default eval/config.yaml. Absolute paths are used as-is.
# Directory of the case YAML files. Default: eval/cases (default layout) or cases (with --config).
# cases: eval/cases
# Where the run report is written. Default: caseResults.
# outputDir: caseResults
# Judge trap pairs. Default: the set bundled in the eval jar. Set a file to use your own.
# calibration:
#   trapPairs: my-trap-pairs.yaml
#   labeledSample: calibration/labeled-sample.yaml   # the Groundedness sample; default: the 20 pairs bundled in the jar
# Where the harness gets the chunks the assistant was built on. Default: docs from ./docs.
knowledgeBase:
  type: docs        # chunk a docs directory with the reference Chunker
  path: docs        # relative to the config file's directory (repo root for this file)
# Other sources (http and manifest are placeholders: selecting one exits with "not implemented yet").
#   type: http                                 # the app serves the chunks it indexed
#   url: http://localhost:8080/chunks          # GET returns [{"id": "consent-mode#default-consent-states", "text": "..."}]
#
# knowledgeBase:
#   type: manifest                             # a JSON file exported by the app's build
#   path: kb/manifest.json                     # same [{"id": ..., "text": ...}] array, relative to the config directory
