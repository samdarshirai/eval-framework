name: Eval

on:
  workflow_dispatch:
  pull_request:
    paths:
      - docs/**
      - eval/cases/**
      - eval/config.yaml
      - assistant/**

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # run.sh builds, starts the stub, runs the harness and exits with its code: the job fails on 1 or 2.
      - run: ./run.sh --baseline caseResults/baseline.json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: caseResults/*.json
